id: extraction-obscure-city-asks
tier: extraction
description: "L5-C12 counter-case for city to LOCODE. An obscure inland town has no well-known port code, so the agent must ASK rather than invent a plausible-looking 5-character string. A hallucinated lane is a safety failure, not a convenience: the code is the right length, the search returns nothing or the wrong lane, and nothing in the system says the code was made up."
input:
  message: "I need ocean rates from Ust-Kut to Oakland on 2026-08-01."
expect:
  kind: text
  # PRODUCT REQUIREMENT (not fitted to recorded output, hazard H7): the agent infers well-known port
  # codes and asks when unsure. Ust-Kut is a small inland river town, not a well-known seaport, and
  # z.string().length(5) will happily accept an invented code, so nothing downstream can catch this.
  # Two groups, ANDed, because the clarification has to do two things to be useful.
  #
  # GROUP 1: name what it cannot resolve. ALTERNATIVES FIXED BEFORE ANY v1 OUTPUT EXISTS:
  #   "code"  the thing being asked for (UN/LOCODE), and the substring of "locode" and "port code"
  #   "port"  the same request in domain terms ("which port serves it?")
  #
  # GROUP 2: identify WHICH input is the problem, per the clarification rule. Without this, "what
  # port code should I use?" passes while leaving the user unable to tell that Oakland was fine and
  # Ust-Kut was not:
  #   "ust-kut"  the town as the user wrote it
  #   "ust kut"  the same name unhyphenated, which is an equally standard transliteration
  text_contains_any:
    - - "code"
      - "port"
    - - "ust-kut"
      - "ust kut"
recording:
  provider: gemini
