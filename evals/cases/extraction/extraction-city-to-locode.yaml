id: extraction-city-to-locode
tier: extraction
description: "L5-C12 hard class: city to UN/LOCODE. Well-known port cities resolve to their codes without asking. Shanghai is CNSHA, Oakland is USOAK. Asking here would be a false negative: the prompt's 'ask rather than invent' rule must not degrade into asking about everything."
input:
  message: "Ocean freight from Shanghai to Oakland on 2026-08-01, please."
expect:
  kind: tool
  tool: search_rates
  # PRODUCT REQUIREMENT: search_rates takes 5-character UN/LOCODEs (z.string().length(5)), and users
  # write city names. Resolving well-known ports is the agent's job; the schema will not accept
  # "Shanghai".
  #
  # Paired with extraction-obscure-city-asks, which is the counter-case. This case fails if the
  # agent asks; that case fails if it invents. Neither is scoreable alone, because a prompt can pass
  # either one by always doing the single thing that case rewards.
  args:
    origin: "CNSHA"
    dest: "USOAK"
    mode: "OCEAN"
    ship_date: "2026-08-01"
recording:
  provider: gemini
